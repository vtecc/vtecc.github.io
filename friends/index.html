        <div class="waline-wrap">
            <div id="waline-friends" style="min-height: 100px;"></div>
        </div>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(item => {
                    if (item.isIntersecting) {
                        observer.unobserve(item.target);
                        console.log('友链页：Waline区域进入视口，开始加载waline资源');
                        //加载css
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = '/waline/waline.css';
                        document.head.appendChild(link);

                        const moduleScript = document.createElement('script');
                        moduleScript.type = 'module';
                        moduleScript.textContent = `
                            import * as Waline from '/waline/waline.js';
                            Waline.init({
                                el: '#waline-friends',
                                serverURL: 'https://waline.weite.net',
                                pageview: false,
                                comment: true,
                            });
                            console.log('✅友链页Waline初始化成功');
                        `;
                        document.body.appendChild(moduleScript);
                    }
                })
            })
            const box = document.querySelector('#waline-friends');
            if (box) observer.observe(box);
        })
        </script>

        <script>
(function(){
  const startTime = new Date("2025-09-15").getTime();
  function update(){
    const now = Date.now();
    let diff = now - startTime;
    if(diff < 0) diff = 0;

    const day = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hour = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minute = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const second = Math.floor((diff % (1000 * 60)) / 1000);

    const el = document.getElementById('run-time');
    if(el){
      el.innerText = `${day}天 ${hour}时 ${minute}分 ${second}秒`;
    }
  }
  update();
  setInterval(update, 1000);
})();
        </script>
        
    </p>
