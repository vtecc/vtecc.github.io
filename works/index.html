<!-- 计算运行时长的JS -->
<script>
// 获取建站时间（从主题配置读取）
const buildStartTime = new Date('Mon Sep 15 2025 08:00:00 GMT+0800 (中国标准时间)');

// 计算时间差函数
function calculateRunTime() {
  const now = new Date();
  const diff = now - buildStartTime;

  // 计算年、月、天
  const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
  const months = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
  const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 30)) / (1000 * 60 * 60 * 24));

  // 更新显示
  document.getElementById('run-time').textContent = `${years}年${months}月${days}天`;
}

// 初始化计算
calculateRunTime();
// 每天更新一次
setInterval(calculateRunTime, 1000 * 60 * 60 * 24);
</script>
